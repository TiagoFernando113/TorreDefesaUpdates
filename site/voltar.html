<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Voltar ao Cyron Defense</title>
<style>
  :root { --ciano:#00d9ff; --fundo:#080a14; --texto:#c8dcea; --fraco:#5b7a95; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--fundo); color:var(--texto);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  .caixa { width:100%; max-width:420px; }
  .ok { color:var(--ciano); font-size:15px; letter-spacing:.16em; margin:0 0 10px; }
  h1 { font-size:26px; line-height:1.25; margin:0 0 8px; color:#fff; font-weight:700; }
  .sub { font-size:15px; color:var(--fraco); margin:0 0 32px; }
  .botao {
    display:block; background:var(--ciano); color:#04121a;
    font-size:20px; font-weight:700; text-decoration:none;
    padding:20px 24px; border-radius:999px;
    box-shadow:0 0 28px rgba(0,217,255,.22);
  }
  .botao:active { transform:translateY(1px); }
  .dica { font-size:13px; color:var(--fraco); margin:26px 0 0; line-height:1.6; }
  .tecla {
    display:inline-block; border:1px solid var(--fraco); border-radius:6px;
    padding:0 7px; margin:0 2px; color:var(--texto);
  }
</style>
</head>
<body>
  <main class="caixa">
    <p class="ok">&#10003; LOGIN CONFIRMADO</p>
    <h1>Tudo certo!</h1>
    <p class="sub">Agora e' so' voltar para o jogo.</p>

    <!-- O nome do pacote e' fixo neste arquivo, nunca vem da URL: se viesse,
         este endereco viraria um jeito de fazer o Android abrir qualquer
         aplicativo instalado. Quem escolhe entre as duas paginas e' a funcao
         `entrar`, no servidor, que tem a lista fechada. -->
    <a class="botao" href="intent://cyron-login/#Intent;scheme=https;package=com.tiago.cyrondefense;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;S.browser_fallback_url=https%3A%2F%2Ftiagofernando113.github.io%2FTorreDefesaUpdates%2Fvoltar.html;end">VOLTAR AO JOGO</a>

    <p class="dica">
      Se o botao nao abrir o jogo, toque em <span class="tecla">&#9665;</span>
      ou troque de aplicativo.<br>
      O login ja' esta feito &mdash; ele entra sozinho assim que aparecer na tela.
    </p>
  </main>
</body>
</html>
