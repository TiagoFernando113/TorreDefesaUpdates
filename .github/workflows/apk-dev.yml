# Monta o APK do app de DESENVOLVEDOR e publica em Releases.
#
# POR QUE NAO E' UM ARQUIVO NO REPOSITORIO
#
# O APK de desenvolvedor passou a levar o audio junto (~100 MB de trilha), e o
# total ficou em ~200 MB. O GitHub recusa arquivo acima de 100 MiB num push --
# entao o jeito antigo, commitar em dev/ e baixar pelo raw.githubusercontent,
# deixou de caber. Release aceita ate' 2 GB por arquivo.
#
# De quebra resolve o motivo de tudo isto existir: gerar um APK novo deixa de
# depender de alguem com o ambiente montado na maquina. E um botao.
#
# COMO RODA: sozinho, quando chega na main uma mudanca que SO' um APK resolve
# (ver o filtro de caminhos abaixo). Mudanca de codigo nao passa mais por aqui:
# ela sai pelo pacote, e o app baixa sozinho. Da' para forcar pela aba
# Actions -> "APK de desenvolvedor" -> Run workflow, com os campos vazios
# (numero automatico) ou preenchidos (numero forcado).
#
# ATENCAO AO ACUMULO: cada build publica uma Release de ~200 MB e nada e'
# apagado automaticamente. Isso e' de proposito -- apagar release e' destrutivo
# e nao vou fazer isso sozinho -- mas depois de algumas dezenas de builds vale
# limpar as antigas na mao.

name: APK de desenvolvedor

on:
  # AUTOMATICO, mas so' para o que APK novo e' a UNICA saida.
  #
  # Codigo, telas e listas (scripts/, ui/, scenes/, modulos/, data/) saem pelo
  # PACOTE agora -- ver .github/workflows/pacote-dev.yml. O app instalado baixa
  # sozinho, na abertura seguinte, uns 2 MB. Enquanto uma mudanca de uma linha
  # disparava aqui, cada correcao virava 208 MB para baixar no celular e
  # instalar por cima. Era esse o incomodo, e ele nao era necessario.
  #
  # O que sobrou nesta lista e' o que nenhum pacote alcanca:
  #   project.godot -- autoload novo, e qualquer ajuste de projeto; a lista de
  #     autoloads mora no project.binary, lido antes de qualquer pacote
  #   assets/ e addons/ -- arte, audio e plugins; sao o peso do APK
  #   as ferramentas que montam o APK e este arquivo
  # Ver docs/o_que_exige_apk_novo.md.
  push:
    branches: [main]
    paths:
      - "addons/**"
      - "assets/**"
      - "project.godot"
      - "tools/exportar_apk_dev.sh"
      # O remendo do manifesto decide se o endereco cyron:// entra no APK.
      # Ele ficou de fora desta lista, e o resultado foi exatamente o que se
      # espera: mudei o remendo, mesclei, e nenhum APK foi montado -- a correcao
      # existia no repositorio e nao existia em lugar nenhum que importasse.
      - "tools/endereco_proprio_android.py"
      - ".github/workflows/apk-dev.yml"

  # Manual, para forcar um numero especifico. Os dois campos sao OPCIONAIS:
  # vazio = proximo numero automatico.
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (vazio = proximo automatico)"
        required: false
        default: ""
      version_name:
        description: "nome da versao (vazio = gerado do numero)"
        required: false
        default: ""

permissions:
  contents: write   # necessario para criar/atualizar a Release

jobs:
  apk:
    name: montar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # A versao esta presa de proposito: os templates de exportacao TEM que
      # ser exatamente da mesma versao do editor, senao a exportacao falha.
      - name: Baixar o Godot 4.6.2 e os templates
        run: |
          set -e
          BASE=https://github.com/godotengine/godot/releases/download/4.6.2-stable
          curl -sSL -o godot.zip "$BASE/Godot_v4.6.2-stable_linux.x86_64.zip"
          curl -sSL -o tpz.zip   "$BASE/Godot_v4.6.2-stable_export_templates.tpz"
          unzip -q godot.zip && chmod +x Godot_v4.6.2-stable_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q tpz.zip -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/4.6.2.stable
          ./Godot_v4.6.2-stable_linux.x86_64 --version

      # A keystore de DEPURACAO nao e' segredo: senha publica e fixa, igual em
      # qualquer instalacao do Android. Gerar na hora evita guardar arquivo
      # binario no repositorio -- e a de RELEASE nao entra aqui, nem deve.
      - name: Gerar a keystore de depuracao
        run: |
          mkdir -p ~/.local/share/godot/keystores
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore ~/.local/share/godot/keystores/debug.keystore \
            -storepass android -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US' -noprompt

      # O Godot descobre o SDK sozinho pelo ANDROID_HOME e grava nas proprias
      # configuracoes -- conferido apagando as configuracoes e exportando so'
      # com a variavel: o APK saiu inteiro.
      #
      # Mas se o runner mudar de layout, a exportacao falharia la' na frente,
      # depois de dez minutos baixando e importando, com erro de assinatura --
      # que nao diz nada sobre a causa. Melhor reprovar aqui, em dois segundos,
      # dizendo o que faltou.
      - name: Conferir o SDK do Android
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "ANDROID_HOME/ANDROID_SDK_ROOT nao aponta para um SDK (veio: '$SDK')."
            echo "Sem SDK nao ha apksigner, e o APK sai sem assinatura -- o Android recusa instalar."
            exit 1
          fi
          APKSIGNER="$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "Nao achei apksigner em $SDK/build-tools/*/"
            ls "$SDK/build-tools" 2>/dev/null || echo "  (nem a pasta build-tools existe)"
            exit 1
          fi
          echo "SDK:       $SDK"
          echo "apksigner: $APKSIGNER"
          echo "java:      $(java -version 2>&1 | head -1)"

      # A compilacao Gradle do Godot exige JDK 17. O runner traz varias versoes
      # e a padrao muda com o tempo -- fixar aqui evita um erro de Gradle que
      # nao diz "faltou Java 17", diz outra coisa.
      - name: Fixar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Importar o projeto
        run: |
          timeout 900 ./Godot_v4.6.2-stable_linux.x86_64 --headless --path . --import \
            > /tmp/import.log 2>&1 || true
          tail -3 /tmp/import.log

      # O NUMERO SE RESOLVE SOZINHO.
      #
      # Ele vem do que ja' existe em Releases: pega o maior `dev-N` publicado e
      # soma um. Assim nunca repete (o Android recusaria a instalacao) e nunca
      # depende de alguem lembrar qual foi o ultimo.
      #
      # O modo manual continua podendo forcar um numero, mas com os campos
      # vazios ele cai no automatico tambem.
      - name: Decidir a versao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          CODE="${{ inputs.version_code }}"
          NAME="${{ inputs.version_name }}"

          if [ -z "$CODE" ]; then
            # O maior numero ja' publicado. `|| true` porque um repositorio sem
            # nenhuma release ainda e' um caso legitimo, nao um erro.
            ULTIMO="$(gh release list --limit 100 --json tagName --jq \
              '[.[] | select(.tagName | test("^dev-[0-9]+$")) | (.tagName | ltrimstr("dev-") | tonumber)] | max // 0' \
              2>/dev/null || echo 0)"
            ULTIMO="${ULTIMO:-0}"
            [ "$ULTIMO" = "null" ] && ULTIMO=0
            CODE=$((ULTIMO + 1))
            echo "ultimo publicado: $ULTIMO  ->  proximo: $CODE"
          fi

          case "$CODE" in
            ''|*[!0-9]*) echo "versionCode invalido: '$CODE'"; exit 1 ;;
          esac
          [ "$CODE" -gt 0 ] || { echo "versionCode tem que ser maior que zero"; exit 1; }

          [ -z "$NAME" ] && NAME="0.12.0-dev$CODE"
          TAG="dev-$CODE"

          echo "TAG=$TAG"   >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "tag=$TAG  versionCode=$CODE  nome=$NAME"

      # O script confere o APK QUE SAIU e reprova se faltar permissao, audio,
      # a lista de modulos ou o endereco cyron:// do jogo. Preset com chave errada nao da' erro, so' fica sem
      # efeito -- ja' aconteceu, e o APK saiu sem INTERNET.
      - name: Exportar o APK
        env:
          VERSION_CODE: ${{ env.CODE }}
          VERSION_NAME: ${{ env.NAME }}
        run: tools/exportar_apk_dev.sh "$PWD/Godot_v4.6.2-stable_linux.x86_64"

      - name: Publicar na Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cat > /tmp/notas.md <<'NOTAS'
          App de **desenvolvedor**. Instala AO LADO do jogo de verdade — o pacote é
          `com.tiagofernando.cyrondev`, então ele não substitui nem apaga nada.

          Baixe o `CyronDEV.apk` aqui embaixo e instale no celular.

          O painel de manutenção abre com **cinco toques no canto superior esquerdo**
          (dentro de três segundos). Ele mostra os pacotes aplicados, os módulos
          carregados e os últimos erros — e tem o botão de descartar pacotes.
          NOTAS
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dev/CyronDEV.apk#CyronDEV.apk" --clobber
          else
            gh release create "$TAG" --title "Cyron DEV $NAME" \
              --notes-file /tmp/notas.md "dev/CyronDEV.apk#CyronDEV.apk"
          fi
          echo "Link direto para baixar:"
          gh release view "$TAG" --json assets --jq '.assets[].url'
